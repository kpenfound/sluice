<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="common.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        color: #16242a;
        background: #f4f7f6;
      }
      .loading {
        color: #4b6063;
      }
      .message {
        color: #7a4b00;
        font-weight: 600;
      }
      .bucket-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .bucket-button {
        padding: 0.4rem 1rem;
        border: 1px solid #c7d3d2;
        border-radius: 999px;
        background: #ffffff;
        color: #16242a;
        cursor: pointer;
      }
      .bucket-button.selected {
        border-color: #087e83;
        background: #e3f3f2;
        color: #065458;
        font-weight: 700;
      }
      .bucket-button.stale {
        border-style: dashed;
        border-color: #9c6b12;
        border-radius: 999px;
        font-style: italic;
        color: #7a4f12;
      }
      .bucket-button.stale.selected {
        border-color: #7a4b00;
        border-radius: 999px;
        background: #f7e8cf;
        color: #5c3900;
      }
      .top-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .top-row .bucket-switcher {
        flex: 1 1 auto;
        margin-bottom: 0;
      }
      .search-input {
        display: block;
        width: 100%;
        max-width: 24rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid #c7d3d2;
        border-radius: 8px;
        background: #ffffff;
        color: #16242a;
      }
      button,
      select,
      input:not([type="checkbox"]) {
        border: 1px solid #c7d3d2;
        border-radius: 8px;
        background: #ffffff;
        color: #16242a;
      }
      .banner {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 10px;
        border: 1px solid #d8ad5c;
        background: #fdf0da;
        color: #7a4b00;
      }
      .banner span {
        flex: 1 1 auto;
      }
      .main-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
        gap: 1rem;
        align-items: start;
      }
      .queue-section {
        background: #ffffff;
        border: 1px solid #c7d3d2;
        border-radius: 10px;
        padding: 0.75rem;
      }
      .item-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .item-card {
        border: 1px solid #c7d3d2;
        border-radius: 10px;
        padding: 0.6rem;
        background: #ffffff;
      }
      .item-card.overdue {
        border-color: #c67c1e;
        background: #fbe8d2;
      }
      .item-card:focus {
        outline: 2px solid #087e83;
        outline-offset: 2px;
      }
      .item-header {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .favicon {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .favicon-placeholder {
        display: inline-block;
        border-radius: 4px;
        background: #c7d3d2;
      }
      .item-title {
        font-weight: 600;
        color: inherit;
        text-decoration: none;
        flex: 1 1 auto;
        min-width: 0;
      }
      .item-title:hover {
        text-decoration: underline;
      }
      .item-title.disabled {
        pointer-events: none;
        opacity: 0.5;
        cursor: default;
      }
      .item-riffle {
        flex: none;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #345254;
        background: #e1e8e7;
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
      }
      .item-bucket,
      .item-domain,
      .item-meta,
      .item-due {
        display: block;
        font-size: 0.8rem;
        color: #4b6063;
      }
      .item-due {
        font-weight: 600;
        color: #16242a;
      }
      .item-card.overdue .item-due {
        color: #7a4b00;
      }
      .item-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .open-tabs-panel {
        margin-bottom: 1rem;
        background: #ffffff;
        border: 1px solid #c7d3d2;
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
      }
      .open-tabs-panel h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4b6063;
        margin: 0 0 0.5rem;
      }
      .open-tabs-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .open-tabs-header h2 {
        margin: 0;
      }
      .wash-now-button {
        padding: 0.35rem 0.9rem;
        border: 1px solid #b3261e;
        border-radius: 8px;
        background: #ffffff;
        color: #b3261e;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 0.5rem;
      }
      .open-tabs-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .open-tab-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid #e1e8e7;
      }
      .open-tab-row:last-child {
        border-bottom: none;
      }
      .open-tab-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .open-tab-domain {
        font-size: 0.8rem;
        color: #4b6063;
        flex: none;
      }
      .open-tab-cue {
        font-size: 0.8rem;
        font-weight: 600;
        color: #16242a;
        flex: none;
      }
      .open-tab-keep-open {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.8rem;
        color: #4b6063;
        flex: none;
      }
      .recently-closed-panel {
        margin-bottom: 1rem;
        background: #ffffff;
        border: 1px solid #c7d3d2;
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
      }
      .recently-closed-panel h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #4b6063;
        margin: 0 0 0.5rem;
      }
      .recently-closed-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .recently-closed-header h2 {
        margin: 0;
      }
      .recently-closed-toggle {
        padding: 0.3rem 0.8rem;
        border: 1px solid #c7d3d2;
        border-radius: 999px;
        background: #ffffff;
        color: #16242a;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .closed-tabs-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .closed-tab-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid #e1e8e7;
      }
      .closed-tab-row:last-child {
        border-bottom: none;
      }
      .closed-tab-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .closed-tab-domain,
      .closed-tab-time {
        font-size: 0.8rem;
        color: #4b6063;
        flex: none;
      }
      .triage-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .triage-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.6rem;
        background: #ffffff;
        border: 1px solid #c7d3d2;
        border-radius: 10px;
      }
      .triage-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .triage-domain {
        font-size: 0.8rem;
        color: #4b6063;
        flex: none;
      }
      .triage-bucket-buttons,
      .triage-riffle-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .triage-bucket-button,
      .triage-riffle-button {
        padding: 0.35rem 0.8rem;
        border: 1px solid #c7d3d2;
        border-radius: 999px;
        background: #ffffff;
        color: #16242a;
        cursor: pointer;
      }
      .triage-bucket-button.selected {
        border-color: #087e83;
        background: #e3f3f2;
        color: #065458;
        font-weight: 700;
      }
      .triage-empty {
        color: #4b6063;
      }
      .triage-footer {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .triage-close-count {
        margin: 0;
        flex: 1 1 auto;
      }
      .triage-confirm {
        padding: 0.45rem 0.9rem;
        border: 1px solid #b3261e;
        border-radius: 8px;
        background: #b3261e;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      .triage-cancel {
        padding: 0.45rem 0.9rem;
        border: 1px solid #c7d3d2;
        border-radius: 8px;
        background: #ffffff;
        color: #16242a;
        cursor: pointer;
      }
      .item-title, .item-domain { overflow-wrap: anywhere; }
      .open-tab-row { flex-wrap: wrap; }
      .item-actions select { min-width: 0; max-width: 100%; }
      @media (max-width: 900px) {
        .main-content { grid-template-columns: 1fr; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e8e8e8;
          background: #1a1a1a;
        }
        body {
          color: #e8e8e8;
          background: #1a1a1a;
        }
        .loading {
          color: #aaaaaa;
        }
        .message {
          color: #f0b94f;
        }
        .bucket-button {
          border-color: #555555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        .bucket-button.selected {
          border-color: #2dd4bf;
          background: #16302e;
          color: #bdf2ec;
        }
        .bucket-button.stale {
          border-color: #8a6a2c;
          color: #e8c267;
        }
        .bucket-button.stale.selected {
          border-color: #d9a033;
          background: #3a2a12;
          color: #f0b94f;
        }
        .search-input {
          border-color: #555555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        .banner {
          border-color: #8a6a2c;
          background: #332d16;
          color: #f0b94f;
        }
        .queue-section {
          background: #242424;
          border-color: #3a3a3a;
        }
        .item-card {
          border-color: #3a3a3a;
          background: #2a2a2a;
        }
        .item-card.overdue {
          border-color: #d9a033;
          background: #3a2a12;
        }
        .item-card:focus {
          outline-color: #2dd4bf;
        }
        .favicon-placeholder {
          background: #555555;
        }
        .item-bucket,
        .item-domain,
        .item-meta,
        .item-due {
          color: #aaaaaa;
        }
        .item-due {
          color: #dddddd;
        }
        .item-card.overdue .item-due {
          color: #f0b94f;
        }
        .item-riffle {
          color: #cfcfcf;
          background: #333333;
        }
        .open-tabs-panel,
        .recently-closed-panel,
        .triage-row {
          background: #242424;
          border-color: #3a3a3a;
        }
        .open-tabs-panel h2,
        .recently-closed-panel h2 {
          color: #aaaaaa;
        }
        .recently-closed-toggle {
          border-color: #555555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        .wash-now-button {
          border-color: #c0392b;
          background: #2a2a2a;
          color: #e2776b;
        }
        .open-tab-row,
        .closed-tab-row {
          border-bottom-color: #3a3a3a;
        }
        .open-tab-domain,
        .open-tab-keep-open,
        .closed-tab-domain,
        .closed-tab-time,
        .triage-domain,
        .triage-empty {
          color: #aaaaaa;
        }
        .open-tab-cue {
          color: #dddddd;
        }
        .triage-bucket-button,
        .triage-riffle-button {
          border-color: #555555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        .triage-bucket-button.selected {
          border-color: #2dd4bf;
          background: #16302e;
          color: #bdf2ec;
        }
        .triage-confirm {
          border-color: #c0392b;
          background: #c0392b;
          color: #ffffff;
        }
        .triage-cancel {
          border-color: #555555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        button,
        select,
        input:not([type="checkbox"]) {
          background: #2a2a2a;
          border-color: #555555;
          color: #e8e8e8;
        }
        button:hover {
          background: #333333;
        }
        :focus-visible {
          outline-color: #2dd4bf;
        }
        #error,
        [role="alert"] {
          color: #f0b94f;
        }
        .empty-state {
          background: #242424;
        }
        .keyboard-help {
          color: #aaaaaa;
        }
      }
    </style>
    <script type="module" src="newtab.js"></script>
  </head>
  <body class="newtab">
    <main id="app"></main>
  </body>
</html>
