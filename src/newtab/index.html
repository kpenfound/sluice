<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="common.css" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        color: #1a1a1a;
        background: #fafafa;
      }
      .loading {
        color: #666;
      }
      .message {
        color: #a4321e;
        font-weight: 600;
      }
      .bucket-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }
      .bucket-button {
        padding: 0.4rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .bucket-button.selected {
        border-color: #333;
        font-weight: 700;
      }
      .bucket-button.stale {
        border-style: dashed;
        font-style: italic;
        color: #555;
      }
      .bucket-button.stale.selected {
        border-color: #333;
        background: #f4f1e8;
      }
      .top-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }
      .top-row .bucket-switcher {
        flex: 1 1 auto;
        margin-bottom: 0;
      }
      .search-input {
        display: block;
        width: 100%;
        max-width: 24rem;
        padding: 0.4rem 0.6rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .banner {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-bottom: 1rem;
        padding: 0.6rem 0.8rem;
        border-radius: 4px;
        border: 1px solid #c9c0a0;
        background: #fff6dc;
      }
      .banner span {
        flex: 1 1 auto;
      }
      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        align-items: start;
      }
      .queue-section {
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 0.5rem;
      }
      .item-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .item-card {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.5rem;
        background: #fdfdfd;
      }
      .item-card.overdue {
        border-color: #a4321e;
        background: #fdece8;
      }
      .item-card:focus {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      .item-header {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .favicon {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .favicon-placeholder {
        display: inline-block;
        border-radius: 2px;
        background: #ccc;
      }
      .item-title {
        font-weight: 600;
        color: inherit;
        text-decoration: none;
        flex: 1 1 auto;
        min-width: 0;
      }
      .item-title:hover {
        text-decoration: underline;
      }
      .item-title.disabled {
        pointer-events: none;
        opacity: 0.5;
        cursor: default;
      }
      .item-riffle {
        flex: none;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        background: #eee;
        border-radius: 3px;
        padding: 0.1rem 0.4rem;
      }
      .item-bucket,
      .item-domain,
      .item-meta,
      .item-due {
        display: block;
        font-size: 0.8rem;
        color: #666;
      }
      .item-due {
        font-weight: 600;
        color: #333;
      }
      .item-card.overdue .item-due {
        color: #a4321e;
      }
      .item-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.4rem;
      }
      .open-tabs-panel {
        margin-bottom: 1rem;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
      }
      .open-tabs-panel h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin: 0 0 0.5rem;
      }
      .open-tabs-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .open-tabs-header h2 {
        margin: 0;
      }
      .wash-now-button {
        padding: 0.3rem 0.7rem;
        border: 1px solid #a4321e;
        border-radius: 4px;
        background: #fff;
        color: #a4321e;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 0.5rem;
      }
      .open-tabs-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .open-tab-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.3rem 0;
        border-bottom: 1px solid #eee;
      }
      .open-tab-row:last-child {
        border-bottom: none;
      }
      .open-tab-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .open-tab-domain {
        font-size: 0.8rem;
        color: #666;
        flex: none;
      }
      .open-tab-cue {
        font-size: 0.8rem;
        font-weight: 600;
        color: #333;
        flex: none;
      }
      .open-tab-keep-open {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.8rem;
        color: #666;
        flex: none;
      }
      .recently-closed-panel {
        margin-bottom: 1rem;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
      }
      .recently-closed-panel h2 {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
        margin: 0 0 0.5rem;
      }
      .closed-tabs-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .closed-tab-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.3rem 0;
        border-bottom: 1px solid #eee;
      }
      .closed-tab-row:last-child {
        border-bottom: none;
      }
      .closed-tab-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .closed-tab-domain,
      .closed-tab-time {
        font-size: 0.8rem;
        color: #666;
        flex: none;
      }
      .triage-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .triage-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
      }
      .triage-title {
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .triage-domain {
        font-size: 0.8rem;
        color: #666;
        flex: none;
      }
      .triage-bucket-buttons,
      .triage-riffle-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .triage-bucket-button,
      .triage-riffle-button {
        padding: 0.3rem 0.6rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .triage-bucket-button.selected {
        border-color: #333;
        font-weight: 700;
      }
      .triage-empty {
        color: #666;
      }
      .triage-footer {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .triage-close-count {
        margin: 0;
        flex: 1 1 auto;
      }
      .triage-confirm {
        padding: 0.4rem 0.8rem;
        border: 1px solid #a4321e;
        border-radius: 4px;
        background: #a4321e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .triage-cancel {
        padding: 0.4rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .item-title, .item-domain { overflow-wrap: anywhere; }
      .open-tab-row { flex-wrap: wrap; }
      .item-actions select { min-width: 0; max-width: 100%; }
      @media (max-width: 900px) {
        .main-content { grid-template-columns: 1fr; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e8e8e8;
          background: #1a1a1a;
        }
        body {
          color: #e8e8e8;
          background: #1a1a1a;
        }
        .loading {
          color: #aaa;
        }
        .message {
          color: #ff6b57;
        }
        .bucket-button {
          border-color: #555;
          background: #2a2a2a;
        }
        .bucket-button.selected {
          border-color: #e8e8e8;
        }
        .search-input {
          border-color: #555;
          background: #2a2a2a;
          color: #e8e8e8;
        }
        .banner {
          border-color: #5c5230;
          background: #332d16;
        }
        .column {
          background: #242424;
          border-color: #3a3a3a;
        }
        .column h2,
        .stale-header {
          color: #aaa;
        }
        .item-card {
          border-color: #3a3a3a;
          background: #2a2a2a;
        }
        .item-card.overdue {
          border-color: #ff6b57;
          background: #3a1f1a;
        }
        .item-card:focus {
          outline-color: #5b9bf7;
        }
        .favicon-placeholder {
          background: #555;
        }
        .item-bucket,
        .item-domain,
        .item-meta,
        .item-due {
          color: #aaa;
        }
        .item-due {
          color: #ddd;
        }
        .item-card.overdue .item-due {
          color: #ff6b57;
        }
        .open-tabs-panel,
        .recently-closed-panel,
        .triage-row {
          background: #242424;
          border-color: #3a3a3a;
        }
        .open-tabs-panel h2,
        .recently-closed-panel h2 {
          color: #aaa;
        }
        .wash-now-button {
          border-color: #ff6b57;
          background: #2a2a2a;
          color: #ff6b57;
        }
        .open-tab-row,
        .closed-tab-row {
          border-bottom-color: #3a3a3a;
        }
        .open-tab-domain,
        .open-tab-keep-open,
        .closed-tab-domain,
        .closed-tab-time,
        .triage-domain,
        .triage-empty {
          color: #aaa;
        }
        .open-tab-cue {
          color: #ddd;
        }
        .triage-bucket-button,
        .triage-riffle-button {
          border-color: #555;
          background: #2a2a2a;
        }
        .triage-bucket-button.selected {
          border-color: #e8e8e8;
        }
        .triage-confirm {
          border-color: #c0392b;
          background: #c0392b;
          color: #fff;
        }
        .triage-cancel {
          border-color: #555;
          background: #2a2a2a;
        }
        button,
        select,
        input:not([type="checkbox"]) {
          background: #2a2a2a;
          border-color: #555;
          color: #e8e8e8;
        }
        button:hover {
          background: #333;
        }
        :focus-visible {
          outline-color: #5b9bf7;
        }
        #error,
        [role="alert"] {
          color: #ff6b57;
        }
        .empty-state {
          background: #242424;
        }
        .keyboard-help {
          color: #aaa;
        }
      }
    </style>
    <script type="module" src="newtab.js"></script>
  </head>
  <body class="newtab">
    <main id="app"></main>
  </body>
</html>
